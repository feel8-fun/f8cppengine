[workspace]
name = "f8cppengine"
channels = ["conda-forge"]
platforms = ["win-64", {name = "linux-glibc228", platform = "linux-64", glibc = "2.28"}]

[dependencies]
python = ">=3.14.3,<3.15"
pip = ">=26,<27"
pytest = ">=8.4.2,<9"
conan = ">=2.23,<3"
cmake = ">=3.30,<5"
ninja = ">=1.13,<2"
pkg-config = ">=0.29,<1"
libzenohc = ">=1.9.0,<1.10"
libzenohcxx = ">=1.9.0,<1.10"
gtest = ">=1.17,<2"

[target.linux-64.dependencies]
gxx_linux-64 = ">=11,<12"


[pypi-dependencies]
f8pysdk = {path = ".sdk/python", editable = false}
hatchling = ">=1.28,<2"
basedpyright = ">=1.31,<2"
ruff = ">=0.12,<0.13"

[tasks]
check = "python -m f8pysdk.extension_packaging --check"
